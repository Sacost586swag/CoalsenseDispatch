# Workspace de uv. La raíz depende de todos los miembros para que `uv sync`
# instale todo el monorepo; no se empaqueta (`package = false`).
[project]
name = "coalsense-dispatch"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
    "coalsense-audit",
    "coalsense-common",
    "coalsense-companion",
    "coalsense-orchestrator",
    "coalsense-intents",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "hypothesis==6.170.15",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pyyaml==6.0.3",
    "ruff==0.17.5",
    "types-jsonschema==4.26.0.20261006",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/companion", "apps/orchestrator", "packages/common-py", "packages/intents", "tools/audit"]

[tool.uv.sources]
coalsense-audit = { workspace = true }
coalsense-common = { workspace = true }
coalsense-companion = { workspace = true }
coalsense-orchestrator = { workspace = true }
coalsense-intents = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
addopts = "--strict-markers --import-mode=importlib"
markers = ["integration: necesita red y herramientas externas (pnpm, uv, git)"]

# coalsense_common aún no publica py.typed; su fix definitivo es agregarlo en packages/common-py.
[[tool.mypy.overrides]]
module = "coalsense_common.*"
follow_untyped_imports = true
