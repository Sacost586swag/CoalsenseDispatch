{
  "rules": [
    {
      "id": "RED_PRIVADA",
      "paths": [
        "apps/companion/**/adapters/voice/**/*.py",
        "apps/companion/**/adapters/head_gesture/**/*.py",
        "apps/companion/**/adapters/gaze/**/*.py",
        "apps/companion/**/adapters/voice.py",
        "apps/companion/**/adapters/head_gesture.py",
        "apps/companion/**/adapters/gaze.py",
        "**/vision/**/*.py",
        "apps/companion/**/vision.py",
        "apps/companion/**/voice.py"
      ],
      "exclude": [],
      "allowlist": true,
      "forbid_dynamic": true,
      "forbid_calls": true,
      "own_prefixes": ["coalsense_"],
      "allowed": [],
      "modules": [
        "socket", "_socket", "ssl", "_ssl", "http", "urllib", "ftplib", "smtplib", "poplib",
        "imaplib", "nntplib", "telnetlib", "smtpd", "asyncore", "asynchat", "socketserver",
        "xmlrpc", "asyncio", "selectors", "select", "webbrowser", "wsgiref",
        "logging.handlers", "logging.config", "xml.sax", "xml.dom.pulldom",
        "subprocess", "ctypes", "_ctypes", "pkgutil", "runpy", "importlib.util", "multiprocessing",
        "coalsense_orchestrator",
        "requests", "httpx", "aiohttp", "websockets"
      ]
    },
    {
      "id": "BD_AGENTES",
      "paths": ["apps/orchestrator/**/agents/**/*.py"],
      "exclude": [],
      "forbid_dynamic": true,
      "modules": ["psycopg", "psycopg2", "asyncpg", "sqlalchemy", "coalsense_orchestrator.persistence"]
    },
    {
      "id": "HTTP_SALIENTE",
      "paths": ["**/*.py"],
      "exclude": ["apps/orchestrator/**/gateway/**/*.py", "**/tests/**/*.py", "tools/audit/**/*.py"],
      "forbid_dynamic": true,
      "modules": [
        "requests", "httpx", "aiohttp", "urllib.request", "http.client", "websockets",
        "urllib3", "httpcore", "grpc", "websocket", "pycurl", "socket"
      ]
    }
  ]
}
