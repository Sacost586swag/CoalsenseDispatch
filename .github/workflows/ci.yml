# Marca como requeridos en la proteccion de rama: "CI required" y cada etapa
# (install, lint, typecheck, test, audit, accessibility, integration; ambos sistemas operativos).
# accessibility e integration fallan hasta que existan las tareas turbo test:a11y y
# test:integration (T-00-017 y tareas de integracion): una etapa vacia nunca cuenta como exito.
name: CI

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  start:
    name: Start pipeline timer
    runs-on: ubuntu-latest
    outputs:
      started: ${{ steps.clock.outputs.started }}
    steps:
      - id: clock
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

  install:
    name: install
    needs: [start]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup

  lint:
    name: lint
    needs: [install]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Verify affected-package baseline
        run: git rev-parse --verify origin/main
      - name: Run lint
        run: pnpm turbo run lint --filter='...[origin/main]'

  typecheck:
    name: typecheck
    needs: [install]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Verify affected-package baseline
        run: git rev-parse --verify origin/main
      - name: Run typecheck
        run: pnpm turbo run typecheck --filter='...[origin/main]'

  test:
    name: test
    needs: [install]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Verify affected-package baseline
        run: git rev-parse --verify origin/main
      - name: Run test
        run: pnpm turbo run test --filter='...[origin/main]'

  audit:
    name: audit
    needs: [install]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Require at least one audit task
        run: pnpm turbo run audit --dry=json | node .github/scripts/require-tasks.mjs audit
      - name: Audit all packages
        run: pnpm turbo run audit

  accessibility:
    name: accessibility
    needs: [install]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Require at least one test:a11y task
        run: pnpm turbo run test:a11y --dry=json | node .github/scripts/require-tasks.mjs test:a11y
      - name: Run accessibility checks
        run: pnpm turbo run test:a11y

  integration:
    name: integration
    needs: [install]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Require at least one test:integration task
        run: pnpm turbo run test:integration --dry=json | node .github/scripts/require-tasks.mjs test:integration
      - name: Run integration checks
        run: pnpm turbo run test:integration

  required:
    name: CI required
    needs: [start, install, lint, typecheck, test, audit, accessibility, integration]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every stage to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<< "$NEEDS")
          if [[ -n "$failed" ]]; then
            echo "Stages that did not succeed:"
            echo "$failed"
            exit 1
          fi
      - name: Record total pipeline duration
        if: ${{ always() }}
        env:
          STARTED: ${{ needs.start.outputs.started }}
        run: |
          if [[ "$STARTED" =~ ^[0-9]+$ ]]; then
            elapsed=$(( $(date +%s) - STARTED ))
            echo "Total pipeline duration: ${elapsed}s (target: 900s; from timer start, includes stage queue time)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Total pipeline duration unavailable: timer job did not complete." >> "$GITHUB_STEP_SUMMARY"
          fi
